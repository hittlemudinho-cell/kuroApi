<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Jogos - Patreon Auth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px 25px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #333; }
        h1 { font-size: 22px; color: #fff; }
        .btn { background: #ff424d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; text-decoration: none; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #e03540; }
        .btn-logout { background: #333; }
        .btn-logout:hover { background: #444; }
        
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        select { background: #1e1e1e; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 5px; outline: none; }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .card.locked { border-color: #ff424d44; }
        
        .badge { display: inline-block; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; margin-bottom: 10px; text-transform: uppercase; }
        .badge-premium { background: #ff424d; color: white; }
        .badge-free { background: #2ecc71; color: white; }

        .card h3 { margin-bottom: 10px; color: #fff; }
        .card p { font-size: 14px; color: #aaa; margin-bottom: 15px; line-height: 1.4; }
        
        .downloads { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
        .downloads a { display: block; background: #3498db; color: white; text-align: center; padding: 8px; border-radius: 4px; text-decoration: none; font-size: 14px; }
        .downloads a:hover { background: #2980b9; }
        
        .locked-msg { color: #ff424d; font-size: 13px; font-style: italic; background: rgba(255, 66, 77, 0.1); padding: 8px; border-radius: 4px; text-align: center; }
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Meus Jogos & Patreon</h1>
        <div id="auth-container">
            <!-- Conteúdo injetado via JavaScript -->
        </div>
    </header>

    <main>
        <div class="controls">
            <label for="lang-select">Idioma do Catálogo:</label>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="en">Inglês (EN)</option>
                <option value="pt">Português (PT)</option>
                <option value="es">Espanhol (ES)</option>
            </select>
        </div>

        <div id="games-container" class="games-grid">
            <!-- Os cards dos jogos serão injetados aqui -->
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:3000';

        // Executado ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });

        // 1. Verificar estado da sessão do utilizador
        async function checkSession() {
            try {
                const response = await fetch(`${API_URL}/auth/session`, {
                    credentials: 'include' // Essencial para enviar/receber o cookie de sessão
                });
                const data = await response.json();
                renderAuth(data);
                loadGames();
            } catch (error) {
                console.error('Erro ao verificar sessão:', error);
            }
        }

        // Renderizar a área de autenticação no Header
        function renderAuth(authData) {
            const container = document.getElementById('auth-container');
            
            if (authData.authenticated) {
                const badgeStatus = authData.isSubscriber 
                    ? '<span style="color: #2ecc71; font-weight: bold;">⭐ Assinante Ativo</span>' 
                    : '<span style="color: #e67e22;">⚠️ Sem Assinatura Ativa</span>';

                container.innerHTML = `
                    <div class="user-info">
                        <div>
                            <p>Olá, <strong>${authData.user.name}</strong></p>
                            <small>${badgeStatus}</small>
                        </div>
                        <button class="btn btn-logout" onclick="logout()">Sair</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <a href="${API_URL}/auth/patreon" class="btn">Entrar com Patreon</a>
                `;
            }
        }

        // 2. Carregar jogos da API conforme o idioma selecionado
        async function loadGames() {
            const lang = document.getElementById('lang-select').value;
            const container = document.getElementById('games-container');
            container.innerHTML = '<p>A carregar jogos...</p>';

            try {
                const response = await fetch(`${API_URL}/api/games/${lang}`, {
                    credentials: 'include'
                });
                const result = await response.json();

                if (!result.games || result.games.length === 0) {
                    container.innerHTML = '<p>Nenhum jogo encontrado para este idioma.</p>';
                    return;
                }

                container.innerHTML = '';

                result.games.forEach(game => {
                    const isLocked = game.premium && !result.isSubscriber;
                    const card = document.createElement('div');
                    card.className = `card ${isLocked ? 'locked' : ''}`;

                    let downloadHtml = '';
                    if (game.download) {
                        downloadHtml = '<div class="downloads">';
                        for (const [platform, link] of Object.entries(game.download)) {
                            downloadHtml += `<a href="${link}" target="_blank">Download (${platform.toUpperCase()})</a>`;
                        }
                        downloadHtml += '</div>';
                    } else if (game.lockedMessage) {
                        downloadHtml = `<div class="locked-msg">🔒 ${game.lockedMessage}</div>`;
                    }

                    card.innerHTML = `
                        <div>
                            <span class="badge ${game.premium ? 'badge-premium' : 'badge-free'}">
                                ${game.premium ? 'Premium (Patreon)' : 'Gratuito'}
                            </span>
                            <h3>${game.title}</h3>
                            <p>${game.synops || 'Sem sinopse disponível.'}</p>
                        </div>
                        ${downloadHtml}
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Erro ao carregar jogos:', error);
                container.innerHTML = '<p style="color: #ff424d;">Erro ao carregar os jogos do servidor.</p>';
            }
        }

        function changeLanguage() {
            loadGames();
        }

        // 3. Terminar sessão (Logout)
        async function logout() {
            try {
                const response = await fetch(`${API_URL}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                if (response.ok) {
                    window.location.reload();
                }
            } catch (error) {
                console.error('Erro ao terminar sessão:', error);
            }
        }
    </script>
</body>
</html>
